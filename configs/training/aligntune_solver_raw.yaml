schema_version: 1
experiment_id: E1_solver_raw

runtime:
  backend: "auto"                 # "auto" | "kaggle_gpu" | "hf_zerogpu" | "local_cpu"

dataset:
  curation_config: "configs/data/generation_aya.yaml"
  repo_id: "vital-ar/adversarial-physics-raw-synthetic"
  revision: "REPLACE_WITH_RAW_DATASET_COMMIT_SHA"
  split: "train"
  config_name: null
  data_files: null

base_model:
  repo_id: "CohereLabs/tiny-aya-global"
  revision: "main"

training:
  method: "sft"
  adapter: "lora"
  seed: 42
  parameters:
    learning_rate: 0.0002
    lr_scheduler_type: "cosine"
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    num_train_epochs: 3
    max_seq_length: 1024
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    modules_to_save: null
  notes: "Track 1 Baseline Ablation (E1): Solver LoRA trained on 1,000 raw synthetic examples prior to CuratorKIT filtering."

evaluation:
  config_path: "configs/evaluation/auditkit_benchmark.yaml"

output:
  repo_id: "vital-ar/adversarial-physics-solver-raw-lora"
  local_dir: "checkpoints/solver_raw_lora"
  revision_label: "e1-solver-raw"

reproducibility:
  require_clean_git: true
