pairing:
  require_official_solution: true # Only pass problems that matched an official solution in the manual
  shuffle_seed: 42                # Interleave chapters/books before teacher extraction
  linking_report_path: "data/literature/linking_report.json"
  linked_pairs_path: "data/literature/linked_problem_solution_pairs.jsonl"

books:
  # ============================================================================
  # 1. Shared All-in-One Solution Manual (referenced by all Crowell books below)
  # ============================================================================
  - book_id: "light_and_matter_solutions"
    role: "solution_book"         # "problem_book" | "solution_book" | "standalone"
    title: "Solutions for Conceptual Physics, Light and Matter, Mechanics, Simple Nature, Fields and Circuits, and Modern Physics (B. Crowell & B. Shotwell)"
    format: "pdf"
    url: "https://archive.org/download/lm_solutions/solns-all.pdf"
    path: ""                      # Defaults to data/books/light_and_matter_solutions.pdf when downloaded
    domain: "MULTY-DOMAIN"
    start_page: 1
    end_page: null
    solution_book_id: null
    sections:
      - "Light and Matter"
      - "Simple Nature"
      - "Mechanics"
      - "Conceptual Physics"
      - "Fields and Circuits"
      - "Modern Physics"
    enabled: true

  # ============================================================================
  # 2. Crowell Problem Textbooks (each links to `light_and_matter_solutions`)
  # ============================================================================
  - book_id: "light_and_matter_problems"
    role: "problem_book"
    title: "Light and Matter (Benjamin Crowell)"
    format: "pdf"
    url: "https://archive.org/download/lm_20220102/lm.pdf"
    path: ""                      # Defaults to data/books/light_and_matter_problems.pdf
    domain: "MULTY-DOMAIN"
    start_page: 1
    end_page: null
    solution_book_id: "light_and_matter_solutions"
    solution_section: "Light and Matter"
    enabled: true

  - book_id: "crowell_mechanics"
    role: "problem_book"
    title: "Mechanics (Benjamin Crowell)"
    format: "pdf"
    url: "https://archive.org/download/me_20220102/me.pdf"
    path: ""                      # Defaults to data/books/crowell_mechanics.pdf
    domain: "MECHANICS"
    start_page: 1
    end_page: null
    solution_book_id: "light_and_matter_solutions"
    solution_section: "Mechanics"
    enabled: true

  - book_id: "crowell_fields_and_circuits"
    role: "problem_book"
    title: "Fields and Circuits (Benjamin Crowell)"
    format: "pdf"
    url: "https://archive.org/download/fac_20220102/fac.pdf"
    path: ""                      # Defaults to data/books/crowell_fields_and_circuits.pdf
    domain: "ELECTROMAGNETISM"
    start_page: 1
    end_page: null
    solution_book_id: "light_and_matter_solutions"
    solution_section: "Fields and Circuits"
    enabled: true

  - book_id: "crowell_modern_physics"
    role: "problem_book"
    title: "Modern Physics: With Waves, Thermodynamics, and Optics (Benjamin Crowell)"
    format: "pdf"
    url: "https://archive.org/download/mod_20220102/mod.pdf"
    path: ""                      # Defaults to data/books/crowell_modern_physics.pdf
    domain: "MODERN_PHYSICS"
    start_page: 1
    end_page: null
    solution_book_id: "light_and_matter_solutions"
    solution_section: "Modern Physics"
    enabled: true

  - book_id: "crowell_conceptual_physics"
    role: "problem_book"
    title: "Conceptual Physics (Benjamin Crowell)"
    format: "pdf"
    url: "https://archive.org/download/cp_20220102/cp.pdf"
    path: ""                      # Defaults to data/books/crowell_conceptual_physics.pdf
    domain: "MULTY-DOMAIN"
    start_page: 1
    end_page: null
    solution_book_id: "light_and_matter_solutions"
    solution_section: "Conceptual Physics"
    enabled: true

  - book_id: "crowell_simple_nature"
    role: "problem_book"
    title: "Simple Nature (Benjamin Crowell)"
    format: "pdf"
    url: "https://archive.org/download/simple_nature/simple.pdf"
    path: ""                      # Defaults to data/books/crowell_simple_nature.pdf
    domain: "MULTY-DOMAIN"
    start_page: 1
    end_page: null
    solution_book_id: "light_and_matter_solutions"
    solution_section: "Simple Nature"
    enabled: false

chunking:
  chunk_size_chars: 4000
  chunk_overlap_chars: 400

extraction:
  teacher_model: "CohereForAI/aya-expanse-8b"
  temperature: 0.2
  target_problem_count: null      # null = include ALL valid, self-contained problems (no 250 cap)
  physgym_seed_count: 21
  canonical_pool_target: null     # null = include ALL valid, anti-leakage-verified problems
  id_prefix: "lit"

filtering:
  # Substage 1.2 Selection Filter: 1-to-10 logical derivation steps (counting logical reasoning operations, not displayed lines)
  min_derivation_steps: 1
  max_derivation_steps: 10
  preferred_max_steps: 8
  max_solution_chars: 4500
  solver_max_new_tokens: 1536
  verifier_max_new_tokens: 192

  # Substage 1.2 Diagram & Multi-Part Filtering
  reject_diagram_dependent: true
  split_or_reject_multipart: true

output:
  extracted_problems_path: "data/literature/extracted_problems.jsonl"
  rejected_problems_path: "data/literature/rejected_candidates.jsonl"
  leak_free_raw_pool_path: "data/intermediate/01a_leak_free_raw_pool.jsonl"
  deterministic_curated_pool_path: "data/intermediate/01b_deterministic_curated_pool.jsonl"
  canonical_pool_path: "data/processed/canonical_train.jsonl"
  repo_id: "vital-ar/adversarial-physics-canonical-pool"
