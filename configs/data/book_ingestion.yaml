schema_version: 1
dataset_id: literature_book_ingestion

# Stage 1.2: Literature & Textbook Ingestion with Paired Problem & Solution Books
#
# Model & Runtime Policy:
# - Uses CohereForAI/aya-expanse-8b for textbook problem extraction, multi-part question splitting,
#   and domain classification (8B is fast and sufficient because problem statements and official
#   worked solutions are already deterministically paired via `solution_mapping.py`).
# - Supports execution across `kaggle_gpu` (CUDA fp16/bf16 or 4-bit), `hf_gpu` (Hugging Face GPU via InferenceClient or L4/T4 container),
#   and `local_cpu` (`torch.float32`).

runtime:
  backend: "auto"                 # "auto" | "kaggle_gpu" | "hf_gpu" | "local_cpu"
  load_in_4bit: true              # Use 4-bit NF4 quantization when running on 16GB T4 GPUs

download:
  enabled: false                  # Set true or pass `--download` / `--download-only` to download missing PDFs
  dir: "data/books"
  timeout_s: 120

chapters:
  dir: "data/chapters"            # Per-book folders with `<XX>_<chapter_title>.pdf` and `<book_id>_solutions.pdf`
  initial_book_dataset_path: "data/literature/initial_book_dataset.jsonl"
  initial_book_summary_path: "data/literature/initial_book_dataset_summary.json"
