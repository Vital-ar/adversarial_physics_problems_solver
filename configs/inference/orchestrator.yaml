runtime:
  backend: "auto"                 # "auto" | "kaggle_gpu" | "hf_zerogpu" | "local_cpu"

orchestrator:
  base_model: "CohereLabs/tiny-aya-global"
  solver_adapter_repo_id: "vital-ar/adversarial-physics-solver-e4-adversarial-v3-lora"
  verifier_adapter_repo_id: "vital-ar/adversarial-physics-verifier-e4-curated-v3-lora"
  solver_adapter_path: "models/adapters/solver_e4_adversarial_v3_lora/final_adapter"
  verifier_adapter_path: "models/adapters/verifier_e4_curated_v3_lora/final_adapter"
  prompt_mode: "raw"
  max_revision_iterations: 3       # Turn 0 + up to 2 accumulated-hint revision turns
  solver_max_new_tokens: 1024
  verifier_max_new_tokens: 384     # Generous budget avoids mid-[[CHALLENGE]] sentinel truncation
  temperature_solver: 0.0          # Greedy decoding for reproducible physics derivation
  temperature_verifier: 0.0        # Greedy decoding for consistent verdict classification
  stop_strings:
    - "[[APPROVE]]"
    - "[[CHALLENGE]]"
