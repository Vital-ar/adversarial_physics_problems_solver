[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-physics-problem-solver"
version = "0.1.0"
description = "Adversarial Physics Solver-Verifier pipeline for the Lexsi AI Safety & Alignment Hackathon (Track 1, Problem 8)"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "huggingface_hub>=0.26",
  "datasets>=3.0",
  "sympy>=1.12",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
